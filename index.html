<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안전백과 - 산업재해 뉴스 플랫폼</title>
    <style>
        /* 기본 설정 및 레이아웃 (기존 스타일 유지) */
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; margin: 0; padding: 0; color: #333; overflow-x: hidden; line-height: 1.6; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 50px; background: #fff; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: bold; color: #1A3A5F; cursor: pointer; }
        .menu-icon { font-size: 28px; cursor: pointer; color: #1A3A5F; }

        /* 사이드 메뉴 */
        .side-menu { position: fixed; top: 0; right: -400px; width: 350px; height: 100%; background: #fff; box-shadow: -5px 0 15px rgba(0,0,0,0.1); transition: 0.4s; z-index: 1000; padding: 30px; box-sizing: border-box; overflow-y: auto; }
        .side-menu.active { right: 0; }
        .close-btn { font-size: 30px; cursor: pointer; float: right; color: #999; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: none; z-index: 999; backdrop-filter: blur(2px); }
        .overlay.active { display: block; }

        .side-section { margin-top: 35px; }
        .side-section h4 { border-bottom: 2px solid #1A3A5F; padding-bottom: 10px; margin-bottom: 15px; color: #1A3A5F; }
        .tag { font-size: 14px; background: #1A3A5F; color: #fff; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; display: inline-block; margin: 4px; }

        /* 섹션 */
        .hero { background: #fbfbfb; text-align: center; padding: 60px 20px; }
        .hero h1 { font-size: 32px; color: #1A3A5F; }
        .main-content { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .section-title { font-size: 24px; font-weight: bold; margin-bottom: 30px; border-left: 5px solid #FF4500; padding-left: 15px; }
        .section-title small { display: block; margin-top: 10px; }

        /* 뉴스 카드 */
        .news-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .news-card { background: #fff; border: 1px solid #eee; border-radius: 12px; overflow: hidden; transition: 0.3s; cursor: pointer; }
        .news-card:hover { transform: translateY(-10px); border-color: #1A3A5F; }
        .card-img { height: 150px; background: #f8f9fa; display: flex; align-items: center; justify-content: center; font-size: 40px; position: relative; }
        .category-label { position: absolute; top: 10px; left: 10px; padding: 4px 10px; border-radius: 4px; font-size: 11px; color: #fff; }
        .card-text { padding: 15px; }
        .card-text h3 { margin: 0 0 10px; font-size: 16px; }
    </style>
</head>
<body>

<header>
    <div class="logo" onclick="location.reload()">🚨 안전백과</div>
    <div class="menu-icon" onclick="toggleMenu()">☰</div>
</header>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="side-menu" id="sideMenu">
    <span class="close-btn" onclick="toggleMenu()">&times;</span>
    <div class="side-section">
        <h4>📂 카테고리 선택</h4>
        <div id="category-btns">
            <span class="tag">에너지</span>
            <span class="tag">화학</span>
            <span class="tag">반도체</span>
            <span class="tag">건설</span>
        </div>
    </div>
</div>

<section class="hero">
    <h1>산업현장의 안전, 데이터로 지킵니다</h1>
    <p>원하는 카테고리를 선택하여 전문 정보를 확인하세요.</p>
</section>

<main class="main-content">
    <div class="section-title">최신 안전 동향</div>
    <div id="news-loader" style="text-align:center; padding: 50px;">데이터를 불러오는 중...</div>
    <div class="news-grid" id="newsGrid"></div>
</main>

<script>
    // 1. 카테고리별 설명 데이터
    const categoryInfo = {
        '에너지': '전기, 발전소, 가스 등 에너지 산업 현장의 주요 사고 예방 수칙과 동향입니다.',
        '화학': '유해화학물질 누출, 폭발 방지 등 화학 공정 안전을 위한 전문 정보를 제공합니다.',
        '반도체': '클린룸 가스 관리 및 정밀 설비 유지보수 과정에서의 안전 가이드입니다.',
        '건설': '건설 현장의 추락, 낙하 및 중장비 안전 작업 지침에 관한 최신 소식입니다.',
        '전체': '산업 현장 전반의 실시간 안전 소식을 전달합니다.'
    };

    function toggleMenu() {
        document.getElementById('sideMenu').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    }

    // 2. 뉴스 불러오기 함수
    async function fetchSafetyNews(keyword = '산업재해 사고 안전') {
        const newsGrid = document.getElementById('newsGrid');
        const loader = document.getElementById('news-loader');
        
        loader.style.display = 'block';
        newsGrid.innerHTML = '';

        // 제목 및 설명 업데이트
        const categoryKey = Object.keys(categoryInfo).find(k => keyword.includes(k)) || '전체';
        const description = categoryInfo[categoryKey];
        document.querySelector('.section-title').innerHTML = 
            `최신 안전 동향: ${categoryKey} <small style="font-size:14px; color:#666; font-weight:normal;">${description}</small>`;

        const query = encodeURIComponent(keyword);
        const rssUrl = `https://news.google.com/rss/search?q=${query}&hl=ko&gl=KR&ceid=KR:ko`;
        const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

        try {
            const response = await fetch(apiUrl);
            const data = await response.json();
            loader.style.display = 'none';

            if (!data.items || data.items.length === 0) {
                newsGrid.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">관련 뉴스가 없습니다.</p>';
                return;
            }

            data.items.slice(0, 9).forEach(item => {
                let category = "일반안전";
                let color = "#95a5a6";
                if(item.title.includes('화학')) { category = "화학"; color = "#e67e22"; }
                else if(item.title.includes('반도체')) { category = "반도체"; color = "#3498db"; }
                else if(item.title.includes('에너지')) { category = "에너지"; color = "#1A3A5F"; }
                else if(item.title.includes('건설')) { category = "건설"; color = "#f1c40f"; }

                const card = `
                    <div class="news-card" onclick="window.open('${item.link}', '_blank')">
                        <div class="card-img">
                            <span class="category-label" style="background: ${color};">${category}</span>
                            📰
                        </div>
                        <div class="card-text">
                            <h3>${item.title}</h3>
                            <p>${item.pubDate.split(' ')[0]} | 더보기 🔗</p>
                        </div>
                    </div>
                `;
                newsGrid.insertAdjacentHTML('beforeend', card);
            });
        } catch (error) {
            loader.innerText = "데이터를 불러오는 데 실패했습니다.";
        }
    }

    // 3. 클릭 이벤트 연결 (사이드바 태그 클릭 시)
    document.querySelectorAll('.tag').forEach(tag => {
        tag.onclick = function() {
            const keyword = this.innerText;
            fetchSafetyNews(keyword);
            toggleMenu(); 
        };
    });

    // 첫 화면은 전체 뉴스로 시작
    window.onload = () => fetchSafetyNews();
</script>

</body>
</html>
